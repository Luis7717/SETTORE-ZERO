<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070b14;overflow:hidden;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#e9eef7;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;display:none}

#score i{width:10px;height:14px;border-radius:3px;display:inline-block}
#clock{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 12px);background:#0a1020d9;border:1px solid #ffffff22;border-radius:10px;padding:6px 9px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;min-width:46px;text-align:center}
#radar{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 54px);width:78px;height:118px;border-radius:8px;border:1px solid #ffffff2a;background:#0b3d1fcc}
#hint{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);text-align:center;font-size:13px;font-weight:650;line-height:1.3;text-shadow:0 1px 3px #000,0 0 8px #000}

#hint.hot{text-shadow:none}#hint.hot span{background:#ffe14a;color:#141414;border-color:#ffe14a;font-size:16px;font-weight:800}
#big{position:absolute;left:0;right:0;top:27%;text-align:center;font-weight:900;font-size:46px;letter-spacing:.02em;text-shadow:0 3px 0 #0008,0 0 24px #000a;opacity:0;transform:scale(.8);transition:opacity .18s,transform .18s}
#big.on{opacity:1;transform:scale(1)}
#big small{display:block;font-size:17px;font-weight:700;margin-top:4px}
#big.g{color:#ffe14a}#big.b{color:#ff6b6b}
#slow{position:absolute;inset:0;box-shadow:inset 0 0 90px 30px #0b1a3acc;opacity:0;transition:opacity .15s}
#slow.on{opacity:1}
#camtip{position:absolute;left:12px;right:96px;top:calc(env(safe-area-inset-top) + 60px);display:none;text-align:center;font-size:13px;font-weight:650;line-height:1.3;text-shadow:0 1px 3px #000}
#camtip span{display:inline-block;background:#0a1020c4;border:1px solid #ffffff1f;border-radius:999px;padding:7px 14px}
.camarr{position:absolute;top:46%;display:none;font-size:30px;font-weight:300;color:#fff;opacity:.38;text-shadow:0 1px 4px #000}
.camarr.l{left:6px}.camarr.r{right:6px}
#fade{position:fixed;inset:0;background:#05080f;opacity:0;pointer-events:none;transition:opacity .28s}
#ov{position:fixed;inset:0;display:none;background:#070b14e6;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 24px)}
#ui{position:fixed;inset:0;display:none;background:radial-gradient(120% 70% at 50% 0%,#12305a 0%,#0a1322 55%,#070b14 100%)}
#menubg{position:fixed;inset:0;display:none;pointer-events:none;background:radial-gradient(120% 70% at 50% 0%,#12305a 0%,#0a1322 55%,#070b14 100%)}

#ui.champbg{background:transparent!important}
#ui.champbg .card,#ui.champbg .tile{background:#101a2fb0!important;box-shadow:0 8px 24px #0004}
#ui.champbg .card.next{background:linear-gradient(160deg,#1a2a48c0,#101a2fa8)!important}
#ui.clear{background:linear-gradient(#070b14b0,#070b14f0 62%)}
.scr{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;margin:0 auto}
h1{font-size:24px;margin:0 0 2px;font-weight:850}h2{font-size:20px;margin:0;font-weight:800;flex:1}h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#8fa2c2;margin:20px 0 8px}
.dim{color:#8fa2c2;font-size:13px}.note{color:#9db0cf;font-size:13px;line-height:1.4;margin:10px 2px}
.hero{padding:19vh 0 5vh;text-align:center}.hero.small{padding:5vh 0 2vh}
.logo{font-size:54px;font-weight:900;letter-spacing:-.02em;line-height:.95;font-style:italic}
.logo span{display:inline-block;color:#ffe14a;margin:0 6px;transform:rotate(-8deg)}
.sub{color:#b7c6e0;font-size:16px;margin-top:14px}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:#22314d;color:#fff;font-size:16px;font-weight:750;margin:10px 0;padding:12px 14px;font-family:inherit}
.btn.big{background:#ffe14a;color:#131313;font-size:18px;font-weight:850;min-height:58px;box-shadow:0 4px 0 #b89b10}
.btn.ghost{background:transparent;border:1px solid #ffffff2e;color:#c6d3ea}
.btn.sm{min-height:42px;font-size:14px;margin:8px 0 0}.btn.warn{background:#ff5a5f;color:#fff;border-color:#ff5a5f}
.btn:active,.tile:active,.chip:active{filter:brightness(1.2);transform:translateY(1px)}
.card{background:#131d30;border:1px solid #ffffff14;border-radius:16px;padding:14px;margin:12px 0}
.card label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8fa2c2;margin:6px 0 8px}
input{width:100%;height:50px;border-radius:12px;border:1px solid #ffffff2a;background:#0b1322;color:#fff;font-size:18px;padding:0 14px;font-family:inherit;margin-bottom:12px;-webkit-user-select:text;user-select:text}
.kits{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kit{aspect-ratio:1;border-radius:12px;border:3px solid transparent}.kit.on{border-color:#ffe14a;transform:scale(1.06)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:-14px;background:#0b1526f2;margin:-14px -16px 10px;padding:calc(14px) 16px 10px;z-index:3;border-bottom:1px solid #ffffff12}
.back{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff2a;background:#131d30;color:#fff;font-size:26px;line-height:1;padding-bottom:4px}
.money{background:#0f2a1c;color:#6ff0a6;border:1px solid #3ddc8440;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.flash{background:#ffe14a;color:#141414;border-radius:12px;padding:10px 12px;font-weight:750;margin:8px 0}
.clubbar{display:flex;align-items:center;gap:12px;margin-bottom:6px}.clubbar>div:nth-child(2){flex:1;min-width:0}.clubbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crest{width:46px;height:52px;border-radius:10px 10px 22px 22px;border:2px solid #ffffff55;flex:none}
.next .vs{display:flex;align-items:center;gap:8px;margin:12px 0 6px}.vs>div{flex:1;min-width:0}.vs b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vs span{font-size:12px;color:#8fa2c2}.vs i{color:#ffe14a;font-weight:800;font-style:normal}.vs>div:last-child{text-align:right}
.last{margin:4px 2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:#131d30;border:1px solid #ffffff14;border-radius:16px;padding:14px 12px;text-align:left;color:#fff;font-family:inherit;min-height:74px}
.tile b{display:block;font-size:16px;margin-bottom:4px}.tile span{font-size:12px;color:#8fa2c2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{border:1px solid #ffffff2a;background:#131d30;color:#d5e0f3;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;font-family:inherit;min-height:40px}.chip.on{background:#ffe14a;color:#131313;border-color:#ffe14a}
.prow{display:flex;align-items:center;gap:8px;background:#131d30;border:1px solid #ffffff10;border-radius:12px;padding:10px 10px;margin:6px 0;min-height:48px}
.prow.sel{border-color:#ffe14a;background:#1c2a44}
.pos{font-size:11px;font-weight:850;border-radius:6px;padding:4px 0;width:38px;text-align:center;background:#2a3856;flex:none}
.pP{background:#b9770e}.pD{background:#1f6fb2}.pC{background:#1e8a52}.pA{background:#b3323a}
.pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;font-size:15px}.pn em{color:#ffb86b;font-style:normal;font-size:12px}
.age{color:#8fa2c2;font-size:12px;flex:none}.ovr{font-weight:850;font-size:16px;width:40px;text-align:right;flex:none}
.o1{color:#b7c2d6}.o2{color:#8fd3ff}.o3{color:#6ff0a6}.o4{color:#ffe14a}.bad{color:#ff7b7b}.good{color:#6ff0a6}
.price{font-size:13px;font-weight:800;color:#6ff0a6;width:66px;text-align:right;flex:none}.price.no{color:#ff8f8f}
.pcard{background:#0f1829;border:1px solid #ffe14a55;border-radius:14px;padding:12px;margin:6px 0 10px}
.pc1 b{font-size:17px}.pc1 span{display:block;color:#8fa2c2;font-size:12px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px;text-align:center}.stats i{display:block;font-size:10px;color:#8fa2c2;font-style:normal;letter-spacing:.06em}.stats b{font-size:17px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{color:#8fa2c2;font-weight:700;font-size:11px;padding:6px 3px}.tbl td{padding:9px 3px;text-align:center;border-top:1px solid #ffffff10}.tbl .l{text-align:left;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl tr.me td{background:#ffe14a1c;color:#ffe14a;font-weight:800}.tbl tr.up td:first-child{box-shadow:inset 3px 0 0 #3ddc84}.tbl tr.dn td:first-child{box-shadow:inset 3px 0 0 #ff5a5f}

.res{text-align:center;padding-top:3vh}.score{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0}.score b{font-size:52px;font-weight:900;color:#ffe14a;font-variant-numeric:tabular-nums}.score span{font-weight:800;font-size:18px;width:64px}
.scorers{display:grid;grid-template-columns:1fr;gap:3px;font-size:13px;color:#c6d3ea;margin-bottom:14px;min-height:8px}.gl{text-align:left;padding-left:12%}.gr{text-align:right;padding-right:12%}
.st{display:flex;align-items:center;justify-content:space-between;padding:7px 4px;border-top:1px solid #ffffff10;font-size:14px}.st span{color:#9db0cf}.res .st b{width:56px}
.ovh{text-align:center;font-size:30px;font-weight:900;margin:6vh 0 4px}.ovs{text-align:center;color:#ffe14a;font-size:40px;font-weight:900;margin-bottom:12px}
.en{width:44px;height:6px;border-radius:3px;background:#2a3856;overflow:hidden;flex:none}.en i{display:block;height:100%;background:#6ff0a6}
#tut{position:absolute;left:12px;right:96px;top:calc(env(safe-area-inset-top) + 60px);display:none;background:#0a1020e6;border:1px solid #ffe14a66;border-radius:14px;padding:9px 12px;font-size:14px;font-weight:600;line-height:1.35}

#tut.good{border-color:#5ee08f;background:#0d2a1ae6}

#loadbar{height:100%;width:0;border-radius:99px;background:#ffe14a;transition:width .15s}

#ui{--bg0:#050912;--bg1:#0b1426;--panel:#111c31;--panel2:#18263f;--line:#ffffff14;--line2:#ffffff26;--txt:#eef3fb;--dim:#93a4c3;--gold:#ffd93d;--gold2:#c9a410;--good:#4aeb9f;--bad:#ff7079;--k1:#1746a2;--k2:#ffffff;--r:18px;
  background:radial-gradient(120% 60% at 50% -5%,var(--k1m38-0b1426,#0b1426) 0%,#0a1224 48%,var(--bg0) 100%);color:var(--txt);font-variant-numeric:tabular-nums}
#ui.clear{background:radial-gradient(120% 60% at 50% -5%,var(--k1m32-0b1426,#0b1426) 0%,#0a1224 50%,var(--bg0) 100%)}
#ui .scr{padding:0 16px calc(env(safe-area-inset-bottom) + 32px);max-width:520px}
#ui .scr::before{content:"";display:block;height:calc(env(safe-area-inset-top) + 14px)}
#ui .scr.in>*{animation:uiUp .38s cubic-bezier(.2,.8,.25,1) both}
#ui .scr.in>*:nth-child(2){animation-delay:.04s}#ui .scr.in>*:nth-child(3){animation-delay:.08s}#ui .scr.in>*:nth-child(4){animation-delay:.12s}#ui .scr.in>*:nth-child(5){animation-delay:.16s}#ui .scr.in>*:nth-child(n+6){animation-delay:.2s}
@keyframes uiUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes uiPulse{0%,100%{box-shadow:0 5px 0 var(--gold2),0 10px 28px #ffd93d40}50%{box-shadow:0 5px 0 var(--gold2),0 10px 38px #ffd93d80}}
@media (prefers-reduced-motion:reduce){#ui .scr.in>*,#ui .btn.big.play{animation:none!important}}
#ui h1{font-size:26px;font-weight:850;letter-spacing:-.01em}
#ui h2{font-size:21px;font-weight:800;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ui h3{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.12em;color:var(--dim);margin:24px 2px 10px}
#ui h3::after{content:"";flex:1;height:1px;background:var(--line)}
#ui h3 em{font-style:normal;color:#6b7da0;letter-spacing:.04em;text-transform:none;font-weight:700}
#ui .dim{color:var(--dim)}
#ui .note{color:#a3b4d2;font-size:13.5px;line-height:1.45;margin:10px 2px}

/* pulsanti */
#ui .btn{min-height:52px;border-radius:16px;background:var(--panel2);border:1px solid var(--line2);font-size:16px;font-weight:750;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,filter .12s,background .2s}
#ui .btn.big{min-height:60px;font-size:18px;letter-spacing:.03em;text-transform:uppercase;background:linear-gradient(#ffe45e,var(--gold));color:#15130a;border:0;box-shadow:0 5px 0 var(--gold2),0 10px 26px #ffd93d30}
#ui .btn.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold2),0 4px 14px #ffd93d30;filter:none}
#ui .btn.big.play{animation:uiPulse 2.4s ease-in-out infinite}
#ui .btn.big svg{width:22px;height:22px;flex:none}
#ui .btn.ghost{background:#ffffff08;border:1px solid var(--line2);color:#cbd7ee}
#ui .btn.sm{min-height:46px;font-size:15px;border-radius:14px}
#ui .btn.warn{background:#ff4d58;color:#fff;border-color:#ff4d58}
#ui .btn:active,#ui .tile:active,#ui .chip:active,#ui .prow:active,#ui .kit:active{transform:scale(.975);filter:brightness(1.15)}
#ui .btn.opp{justify-content:space-between;padding:0 18px;text-align:left}
#ui .btn.opp small{font-size:13px;color:var(--dim);font-weight:650}
#ui .btn.opp .lv{display:flex;gap:4px}#ui .btn.opp .lv i{width:9px;height:9px;border-radius:50%;background:#ffffff26}#ui .btn.opp .lv i.on{background:var(--gold)}

/* carte */
#ui .card{background:linear-gradient(180deg,#14213a,#101a2f);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 8px 24px #0006}
#ui .card label{font-size:12px;letter-spacing:.1em;color:var(--dim);margin:4px 0 10px;display:flex;align-items:center;justify-content:space-between}
#ui .card label b{color:var(--txt);letter-spacing:.02em;text-transform:none;font-size:13px}
#ui input{height:54px;border-radius:14px;background:#08101f;border:1.5px solid var(--line2);font-size:18px;font-weight:650;transition:border-color .2s,box-shadow .2s}
#ui input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px #ffd93d22}

/* titolo */
#ui .hero{position:relative;padding:15vh 0 5vh;text-align:center}
#ui .hero.small{padding:3vh 0 1vh}
#ui .hero .pitch{position:absolute;left:50%;top:-4vh;width:130%;max-width:640px;transform:translateX(-50%);opacity:.5;pointer-events:none}
#ui .hero>*:not(.pitch){position:relative}
#ui .ballmark{width:64px;height:64px;margin:0 auto 14px;display:block;filter:drop-shadow(0 6px 14px #0008)}
#ui .hero.small .pitch{opacity:.25}#ui .hero.small .ballmark{width:46px;height:46px;margin-bottom:8px}
#ui .logo{font-size:52px;font-weight:900;letter-spacing:-.025em;line-height:.95;font-style:italic;text-shadow:0 4px 0 #0006,0 10px 30px #0008}
#ui .hero.small .logo{font-size:40px}
#ui .logo span{color:var(--gold);margin:0 5px}
#ui .sub{color:#c3d0e8;font-size:16px;margin-top:16px;letter-spacing:.01em}
#ui .claim{display:flex;justify-content:center;gap:8px;margin-top:22px;flex-wrap:wrap}
#ui .claim i{font-style:normal;font-size:12px;font-weight:750;letter-spacing:.06em;color:#bcd0f0;border:1px solid var(--line2);background:#ffffff0c;border-radius:999px;padding:6px 12px}
#ui .kits{grid-template-columns:repeat(5,1fr);gap:8px}
#ui .kit{position:relative;aspect-ratio:1;min-height:44px;border-radius:14px;border:2px solid transparent;background:#0a1424;display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s,background .15s;padding:0}
#ui .kit svg{width:78%;height:78%;filter:drop-shadow(0 2px 3px #0008)}
#ui .kit.on{border-color:var(--gold);background:#1b2a47;transform:scale(1.05);box-shadow:0 0 0 3px #ffd93d22}
#ui .newhead{display:flex;align-items:center;gap:14px;margin-bottom:8px}
#ui .newhead .crest{width:52px;height:62px}

/* barra squadra + stemma */
#ui .crest{display:block;width:46px;height:54px;border:0;border-radius:0;background:none;flex:none;filter:drop-shadow(0 4px 8px #0008)}
#ui .crest.lg{width:60px;height:72px}
#ui .clubbar{display:flex;align-items:center;gap:12px;margin:0 0 14px}
#ui .clubbar h1{font-size:23px;line-height:1.1}
#ui .clubbar .dim{margin-top:3px;font-size:13px}
#ui .money{background:linear-gradient(#123324,#0d2418);color:var(--good);border:1px solid #46eb9f40;border-radius:999px;padding:0 13px;min-height:34px;display:inline-flex;align-items:center;font-weight:800;font-size:14px;letter-spacing:.01em;white-space:nowrap}
#ui .pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:#ffffff12;color:#c9d6ee}
#ui .pill.gold{background:#ffd93d20;color:var(--gold)}

/* hub: prossima partita */
#ui .card.next{position:relative;overflow:hidden;padding:16px 16px 18px;background:linear-gradient(160deg,var(--k1m34-14213a,#14213a) 0%,#101a2f 62%);border-color:#ffffff1f}
#ui .card.next::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(#ffffff14,transparent 70%);pointer-events:none}
#ui .nx-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
#ui .nx-top .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#b7c7e3}
#ui .vs{display:flex;align-items:flex-start;gap:6px;margin:16px 0 18px}
#ui .vs>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
#ui .vs>div:last-child{text-align:center}
#ui .vs b{font-size:14.5px;line-height:1.2;white-space:normal;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#ui .vs span{font-size:12px;color:var(--dim);font-weight:650}

#ui .fr b{font-size:14px;font-weight:900;line-height:1}
#ui .fr .pos{width:auto;height:14px;padding:0 4px;border-radius:5px;font-size:8.5px;letter-spacing:.03em;font-style:normal;font-weight:850}
#ui .fp{display:block;width:30px;height:30px;margin-top:2px;border-radius:50%;overflow:hidden;flex:none;background:radial-gradient(circle at 50% 35%,var(--k1m40-1c2b49,#1c2b49),#0d1626);border:1px solid #ffffff1f}

#ui .fn{display:block;max-width:100%;margin-top:3px;font-size:10.5px;font-weight:750;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ui .foff{position:absolute;left:2px;top:30px;font-style:normal;font-size:8px;font-weight:900;letter-spacing:.02em;background:#ffbf70;color:#2a1600;border-radius:4px;padding:1px 3px}
#ui .fd{position:absolute;right:2px;top:30px;font-style:normal;font-size:9.5px;font-weight:900;border-radius:4px;padding:1px 3px;line-height:1.2}
#ui .fd.up{background:var(--good);color:#05140c}#ui .fd.dn{background:var(--bad);color:#1a0507}#ui .fd.eq{background:#ffffff2e;color:#dbe4f3}

#ui .fc.just{animation:fcJust 1s ease-out both}
@keyframes fcTgt{50%{box-shadow:0 0 0 5px #cfe0ff40,0 6px 16px #000a}}
@keyframes fcJust{0%{box-shadow:0 0 0 6px #ffd93dcc,0 0 22px #ffd93d}100%{box-shadow:0 4px 10px #0008}}

#ui .bench{flex:none}

#ui .brow .fc{position:relative;flex:none}
