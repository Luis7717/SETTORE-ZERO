name: Settore Zero IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Compila l'app
        run: |
          set -euo pipefail
          APP=build/Payload/SettoreZero.app
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -O \
            -target arm64-apple-ios14.0 -sdk "$SDK" \
            App/main.swift -o "$APP/SettoreZero"
          cp App/Info.plist "$APP/Info.plist"
          cp App/AppIcon60x60@2x.png App/AppIcon60x60@3x.png "$APP/"
          # tutto il gioco: index.html, css/, lib/, models/, js/
          cp -R www/. "$APP/"
          test -f "$APP/index.html"
          printf 'APPL????' > "$APP/PkgInfo"
          codesign --force --sign - --timestamp=none "$APP"
          cd build && zip -qry ../SettoreZero.ipa Payload
          ls -la ../SettoreZero.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SettoreZero-ipa-${{ matrix.runner }}
          path: SettoreZero.ipa

      - name: Pubblica come release scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main -> release "settore-zero-ipa"; ogni altro branch ha la sua release separata
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG=settore-zero-ipa; TITLE="Settore Zero (IPA)"
          else
            B=$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')
            TAG="settore-zero-ipa-${B}"; TITLE="Settore Zero (IPA) — prova branch ${GITHUB_REF_NAME}"
          fi
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -q SettoreZero.ipa && [ "$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)" = "${GITHUB_SHA}" ]; then echo "release già aggiornata"; exit 0; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SettoreZero.ipa \
            --title "$TITLE" \
            --notes "Build automatica dal commit ${GITHUB_SHA} (branch ${GITHUB_REF_NAME}). IPA non firmata: installala con TrollStore, Sideloadly o AltStore." \
            --target "${GITHUB_SHA}" --prerelease || { sleep 8; gh release view "$TAG" > /dev/null; }
